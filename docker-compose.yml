services:
  lab:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MICRODUCK_REPO: https://github.com/unilabsim/microduck_rl_unilab.git
        MICRODUCK_REF: main
    image: microduck-rl-lab:rocm714-py312
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ipc: host
    shm_size: 8gb
    ports:
      - "8888:8888"
    volumes:
      - ./runs:/workspace/runs
      - ./notebooks:/workspace/microduck_rl_lab/notebooks
      - ./scripts:/workspace/microduck_rl_lab/scripts
    environment:
      HIP_VISIBLE_DEVICES: ${HIP_VISIBLE_DEVICES:-0}
      JUPYTER_PORT: 8888
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    command: ["jupyter"]
