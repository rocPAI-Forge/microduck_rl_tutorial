services:
  lab:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MICRODUCK_REPO: https://github.com/unilabsim/microduck_rl_unilab.git
        MICRODUCK_REF: main
        MICRODUCK_EXPECTED_SHA: ${MICRODUCK_EXPECTED_SHA:-8530dbc0ea0b22718c2266c3cb89f2077fa37912}
    image: microduck-rl-lab:rocm714-py312
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ipc: host
    shm_size: 8gb
    ports:
      - "${LAB_HOST_PORT:-8888}:8888"
      - "${TELEOP_HOST_PORT:-16080}:6080"
    volumes:
      - ./runs:/workspace/runs
      - ./notebooks:/workspace/microduck_rl_lab/notebooks
      - ./scripts:/workspace/microduck_rl_lab/scripts
      - ./examples:/workspace/microduck_rl_lab/examples
    environment:
      HIP_VISIBLE_DEVICES: ${HIP_VISIBLE_DEVICES:-0}
      JUPYTER_PORT: 8888
      LAB_QUICK_MODE: ${LAB_QUICK_MODE:-0}
      DISPLAY: ":1"
      TELEOP_PUBLIC_PORT: ${TELEOP_HOST_PORT:-16080}
      TELEOP_VNC_PASSWORD: ${TELEOP_VNC_PASSWORD:-microduck}
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    command: ["jupyter"]
