# Minimal GPU lab pod — same image as docker compose.
# Requires AMD GPU device plugin (or hostPath /dev/kfd + /dev/dri) on the cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: microduck-runs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microduck-rl-lab
  labels:
    app: microduck-rl-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microduck-rl-lab
  template:
    metadata:
      labels:
        app: microduck-rl-lab
    spec:
      containers:
        - name: lab
          image: microduck-rl-lab:rocm714-py312
          imagePullPolicy: IfNotPresent
          command: ["/workspace/microduck_rl_tutorial/scripts/entrypoint.sh", "jupyter"]
          ports:
            - containerPort: 8888
              name: jupyter
          env:
            - name: HIP_VISIBLE_DEVICES
              value: "0"
            - name: JUPYTER_PORT
              value: "8888"
            - name: LAB_QUICK_MODE
              value: "0"
          securityContext:
            privileged: true
          volumeMounts:
            - name: runs
              mountPath: /workspace/runs
            - name: dri
              mountPath: /dev/dri
            - name: kfd
              mountPath: /dev/kfd
          resources:
            limits:
              amd.com/gpu: 1
            requests:
              amd.com/gpu: 1
              memory: 16Gi
      volumes:
        - name: runs
          persistentVolumeClaim:
            claimName: microduck-runs
        - name: dri
          hostPath:
            path: /dev/dri
        - name: kfd
          hostPath:
            path: /dev/kfd
---
apiVersion: v1
kind: Service
metadata:
  name: microduck-rl-lab
spec:
  type: NodePort
  selector:
    app: microduck-rl-lab
  ports:
    - port: 8888
      targetPort: jupyter
      nodePort: 30888
